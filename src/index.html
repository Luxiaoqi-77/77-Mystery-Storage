<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桌宠</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="pet" aria-label="桌宠">
      <div id="body">
        <img id="sprite" src="./assets/pet/base_idle.png" alt="" draggable="false" />
        <img id="sprite-next" src="./assets/pet/base_idle.png" alt="" draggable="false" />
        <div id="eye-stack" aria-hidden="true">
          <img id="eye-whites" src="./assets/pet/eye_whites.png" alt="" draggable="false" />
          <img id="irises" src="./assets/pet/irises.png" alt="" draggable="false" />
          <img id="highlights" src="./assets/pet/highlights.png" alt="" draggable="false" />
          <img id="lashes" src="./assets/pet/lashes.png" alt="" draggable="false" />
          <img id="eyelids" src="./assets/pet/eyelids_half.png" alt="" draggable="false" />
        </div>
      </div>
      <div id="shadow"></div>
    </main>
    <script src="./tauri-bridge.js"></script>
    <script src="./renderer.js"></script>
  </body>
</html>
